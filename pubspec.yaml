name: what_to_wear_flutter
description: "智能穿搭推荐应用 - Flutter 版"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  http: ^1.2.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  geocoding: ^4.0.0
  google_generative_ai: ^0.4.7
  share_plus: ^12.0.1
  screenshot: ^3.0.0
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7+1
  umeng_common_sdk: ^1.3.0
  go_router: ^17.1.0
  # Phase 1: 架构依赖
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  equatable: ^2.0.7
  get_it: ^8.0.3
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Phase 1: 代码生成
  freezed: ^2.5.7
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/weather/
    - privacy_policy.md
